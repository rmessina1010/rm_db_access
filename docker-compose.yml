version: '3.2'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: ${DBNAME} # Creates the database automatically on first run
    volumes:
      - rmcms:/var/lib/mysql
      #  Maps local script to the container's entrypoint initialization directory
      - ./rmessina_RMCMS.sql:/docker-entrypoint-initdb.d/init.sql

  webapp:
    build: .
    restart: always
    ports:
      - "80:80"
    environment:
      - DBNAME=${DBNAME}
      - HOST=db
      - UPASS=${UPASS}
      - UACC=${UACC}
    depends_on:
      - db
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_ARBITRARY=1
    depends_on:
      - db
volumes:
  rmcms:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/db
