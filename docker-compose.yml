version: '3.2'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pass
    volumes:
      - rmcms:/var/lib/mysql

  webapp:
    build: .
    restart: always
    ports:
      - "80:80"
    environment:
      - DBNAME=${DBNAME}
      - HOST=db
      - UPASS=${UPASS}
      - UACC=${UACC}
    depends_on:
      - db
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_ARBITRARY=1
    depends_on:
      - db
volumes:
  rmcms:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/db
